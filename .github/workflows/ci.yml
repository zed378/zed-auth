name: CI

# CI is itself an attack surface (SECURITY/02-ATTACK-SURFACE-AND-SCENARIOS.md
# §18). Three rules follow from that and are applied throughout this file:
#
#   1. Every third-party action is pinned by commit SHA, not by tag. A tag is
#      mutable: whoever controls the action's repository can repoint v4 at new
#      code that runs with this workflow's token.
#   2. Permissions are declared explicitly and minimally. The default token
#      grants far more than any job here needs.
#   3. No job triggered by a fork's pull request ever sees a repository secret.
#      `pull_request` (not `pull_request_target`) is used deliberately: it runs
#      against the merge commit without the base repository's secrets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  # --- Task ID enforcement --------------------------------------------------
  # TASKS/00-TASK-CONVENTIONS.md makes the task ID the join key across
  # branches, commits, PRs, MEMORY records, and PROGRESS.md. The local
  # commit-msg hook enforces this too, but a hook can be bypassed with
  # --no-verify and is not installed on a fresh clone.
  commit-convention:
    name: Commit convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Every commit subject carries a task ID
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0

          while IFS= read -r subject; do
            case "$subject" in
              "Merge "*|"Revert "*|fixup!*|squash!*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -Eq '^(([a-z]+)(\([^)]*\))?: *)?(P[0-9]B?-[0-9]+(\.[0-9]+)?|PF-[0-9]+)[:( ]'; then
              echo "::error::Commit subject has no task ID: $subject"
              failed=1
            fi
          done < <(git log --format=%s "$base..$head")

          exit $failed

  # --- Backend --------------------------------------------------------------
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Verify dependency checksums
        working-directory: backend
        # Detects a dependency whose content changed without go.sum changing —
        # the shape a compromised module takes (SECURITY/02 §15).
        run: go mod verify

      - name: go.mod is tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy. Run: cd backend && go mod tidy"; exit 1; }

      - name: Formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./migrations)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Unit tests
        working-directory: backend
        # -race matters most here: sessions, rate limiting, and authorization
        # code redemption are all concurrent paths where a data race is a
        # security bug rather than a flake.
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage floor for security-critical packages
        working-directory: backend
        # A repo-wide average is meaningless: it lets thorough coverage of
        # config offset none at all of the OIDC provider. P0-15 sets a floor
        # per package instead, for the packages where a gap is a vulnerability.
        run: |
          set -euo pipefail
          FLOOR=70
          fail=0
          for pkg in authn authz oidc; do
            line=$(go tool cover -func=coverage.out | grep "internal/$pkg/" | tail -1 || true)
            if [ -z "$line" ]; then
              echo "internal/$pkg: no code yet, skipping"
              continue
            fi
            pct=$(echo "$line" | awk '{print $NF}' | tr -d '%')
            echo "internal/$pkg: ${pct}%"
            if [ "${pct%.*}" -lt "$FLOOR" ]; then
              echo "::error::internal/$pkg coverage ${pct}% is below the ${FLOOR}% floor"
              fail=1
            fi
          done
          exit $fail

  # --- Integration ----------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: auth
          POSTGRES_USER: auth_owner
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auth_owner -d auth"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Create the application role
        # Mirrors deploy/postgres/init/01-roles.sql. The service connects as a
        # role that is NOT the owner and NOT BYPASSRLS, so that row-level
        # security actually applies (P0-08). Running integration tests as the
        # owner would let every RLS assertion pass vacuously.
        env:
          PGPASSWORD: ci_only_password
        run: |
          psql -h localhost -U auth_owner -d auth -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE auth_app WITH LOGIN PASSWORD 'ci_only_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;
          GRANT CONNECT ON DATABASE auth TO auth_app;
          GRANT USAGE ON SCHEMA public TO auth_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE auth_owner IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO auth_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE auth_owner IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO auth_app;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          SQL

      - name: Apply migrations
        working-directory: backend
        env:
          AUTH_MIGRATE_DSN: postgres://auth_owner:ci_only_password@localhost:5432/auth?sslmode=disable
        run: go run ./cmd/migrate up

      - name: Migrations roll back and re-apply cleanly
        working-directory: backend
        # An untested down migration is not a rollback plan. Catching a broken
        # one here is far cheaper than discovering it during an incident.
        env:
          AUTH_MIGRATE_DSN: postgres://auth_owner:ci_only_password@localhost:5432/auth?sslmode=disable
        run: |
          go run ./cmd/migrate down 6
          go run ./cmd/migrate up

      - name: Integration tests
        working-directory: backend
        env:
          AUTH_TEST_OWNER_DSN: postgres://auth_owner:ci_only_password@localhost:5432/auth?sslmode=disable
          AUTH_TEST_APP_DSN: postgres://auth_app:ci_only_password@localhost:5432/auth?sslmode=disable
          AUTH_TEST_REDIS_ADDR: localhost:6379
        run: go test -race -tags=integration ./...

  # --- Migration safety -----------------------------------------------------
  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Destructive migrations require justification
        # PLAN/14 § Rollback Strategy: a migration must leave the PREVIOUS
        # application version able to run against the new schema, so an app
        # rollback never requires a DB rollback. A DROP or RENAME in the same
        # release that stops using something breaks that.
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          new_ups=$(git diff --name-only --diff-filter=A "$base..$head" \
                    -- 'backend/migrations/*.up.sql' || true)
          [ -z "$new_ups" ] && { echo "No new up migrations."; exit 0; }

          fail=0
          for f in $new_ups; do
            if grep -Eiq '(DROP[[:space:]]+(COLUMN|TABLE)|RENAME[[:space:]]+(COLUMN|TO)|ALTER[[:space:]]+COLUMN[[:space:]]+\w+[[:space:]]+TYPE)' "$f"; then
              if ! grep -q 'EXPAND/CONTRACT:' "$f"; then
                echo "::error file=$f::Destructive change without justification. Add a line starting with 'EXPAND/CONTRACT:' explaining why the previous application version still runs against this schema (PLAN/14)."
                fail=1
              fi
            fi
          done
          exit $fail

      - name: Every up migration has a matching down
        run: |
          set -euo pipefail
          fail=0
          for up in backend/migrations/*.up.sql; do
            down="${up%.up.sql}.down.sql"
            if [ ! -f "$down" ]; then
              echo "::error file=$up::No matching down migration. An untested down migration is not a rollback plan; a missing one is not even a claim."
              fail=1
            fi
          done
          exit $fail

  # --- Security -------------------------------------------------------------
  security:
    name: Security scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: gosec (SAST)
        working-directory: backend
        # PLAN/11 § Production-Ready: no unaddressed critical or high findings.
        # -severity medium is deliberately stricter than the gate, so a medium
        # finding is seen and triaged rather than accumulating silently.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -severity medium -confidence medium -exclude-generated ./...

      - name: govulncheck (known CVEs)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Secret scanning
        # SECURITY/02 §16. Catching a committed credential at PR time is the
        # difference between deleting a line and rotating a production key.
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No sensitive values reachable by a log call
        # PLAN/13 and CLAUDE.md: never log tokens, passwords, or raw
        # /v1/authz/check resource attributes. The logger redacts by key name
        # (P0-09), but a raw request body or header passed positionally would
        # slip past that, so it is refused at review time.
        working-directory: backend
        run: |
          set -euo pipefail
          if grep -rnE '(slog|log)\.[A-Za-z]+\([^)]*(r\.Header|r\.Body|req\.Header|req\.Body|\.RawQuery)' \
               --include='*.go' ./cmd ./internal; then
            echo "::error::A raw request header, body, or query string is passed to a log call."
            exit 1
          fi
          echo "No raw request material reaches a log call."

  # --- Docker ---------------------------------------------------------------
  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: backend
          push: false
          load: true
          tags: authservice:ci

      - name: Runtime image runs as non-root
        # SECURITY/02 §17. A root container turns a container escape into a
        # host compromise rather than an inconvenience.
        run: |
          user=$(docker inspect --format '{{.Config.User}}' authservice:ci)
          echo "Image user: '$user'"
          case "$user" in
            ""|"root"|"0"|"0:0")
              echo "::error::Runtime image runs as root"; exit 1 ;;
          esac
