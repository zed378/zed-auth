# Code generation from the API contract (ADR-013).
#
# The spec generates the server interface, not the other way round. A handler
# whose signature stops matching openapi/openapi.yaml fails to compile, which
# is a stronger guarantee than a CI check that notices drift after it is
# pushed.
#
# Run: make openapi-generate

package: api
output: api.gen.go

output-options:
  # Keep components that no operation references yet.
  #
  # Pruning is the sensible default and wrong here. The Error, PageInfo and
  # ResourceId schemas exist precisely so Phase 1 endpoints reuse them instead
  # of each inventing its own error shape, and in Phase 0 none of them has a
  # caller. Pruned, they would vanish from the generated types and the first
  # endpoint to need one would define its own — which is the outcome P0-16
  # exists to prevent.
  skip-prune: true
  nullable-type: true

  # The OAuth protocol endpoints are documented here and routed by hand.
  #
  # This is the exception to ADR-013's "the spec generates the server", and it
  # is deliberate rather than a convenience. The line is between the OAuth
  # protocol endpoints (/oauth/*), whose shape is dictated by RFCs written for
  # browsers and form posts, and the management API (/v1/*), which is REST and
  # will be generated. Both need something the generated strict interface does
  # not hand over: the raw request.
  #
  # /oauth/token needs the Authorization header, because RFC 6749's
  # client_secret_basic puts the client's credentials there. The strict
  # interface passes a parsed body and no request, so the handler could not
  # see it.
  #
  # /oauth/authorize needs the raw query, and for two reasons. The generated
  # wrapper binds and validates every parameter BEFORE the handler runs, which
  # is incompatible with the two properties its security rests on:
  #
  #   * Two-phase validation. Everything except client_id and redirect_uri must
  #     be reported by redirecting to the validated redirect_uri — and the
  #     wrapper would reject a missing `state` before redirect_uri had been
  #     checked, sending the error down the wrong channel.
  #   * Duplicate parameters. The wrapper reads r.URL.Query().Get(), which
  #     silently takes the first value. Parameter pollution is a real bypass
  #     technique and the handler refuses duplicates outright.
  #
  # /oauth/userinfo needs the Authorization header for the same reason
  # /oauth/token does: the bearer credential lives there, and the strict
  # interface hands over neither the header nor the request. It also answers
  # with an RFC 6750 WWW-Authenticate challenge whose contents depend on WHY
  # the request failed, which is a header the generated wrapper has no way to
  # set.
  #
  # The endpoints stay in openapi.yaml, so they are documented, so the public
  # API reference generates from them, and so openapi-shipped-paths.py still
  # checks that the spec claims nothing beyond what ships. Only the code
  # generation is skipped, and httpserver registers the handlers explicitly.
  exclude-operation-ids:
    - authorize
    - token
    - userinfo

generate:
  # Request and response types. The whole point: a field renamed in the spec
  # becomes a compile error at every use site.
  models: true

  # A chi-shaped server interface. The router already uses chi, so this
  # produces a handler contract the existing server mounts directly rather than
  # a parallel routing layer.
  chi-server: true

  # Strict handlers: the generated wrapper handles decoding, validation of
  # required fields, and status-code-to-type mapping, so a handler returns a
  # typed response object instead of writing bytes. That makes "this endpoint
  # returns a 503 with this body" a type, not a convention.
  strict-server: true

  # No client here. The console generates a TypeScript client from the same
  # spec; a Go client would be a third artifact with nobody to use it.
  client: false
  embedded-spec: false
