<!DOCTYPE html>
<!--
  Zed Auth brand identity concept, version 3 ("Mesh") — the geometry-bearing
  extract of the concept document supplied on 2026-09-09.

  This is the REFERENCE, not an asset. brand/check.py parses the symbol below
  and asserts that brand/build.py still describes the same mesh, so the
  generator cannot drift away from the design it was transcribed from without
  a check failing.

  Only the symbol is kept. The specimen sheet's CSS, layout and prose were
  presentation; keeping the whole page would invite edits to it as though it
  were a living document, and it is a fixed record of what was designed.

  From the concept's own description:

    "a triangulated identity graph, hand-placed rather than randomly
    generated, where every line still terminates on a real node. Eight
    application nodes sit on a light-blue-to-navy gradient; one darker hub,
    ringed in indigo, anchors the centre ... the eight outer points still
    resolve into the Z silhouette along the top bar, diagonal, and bottom bar."

  Palette, as specified:
    mesh light  #6BA3FA    mesh mid   #2E4FD1    mesh deep / ink  #0B1220
    hub fill    #16224A    hub ring   #4655F5 (light) / #7B85FA (dark)
    tile        #0B1220, 22% corner radius, mark at 64%
    lockup      mark 72px beside a 34px Space Grotesk wordmark
-->

<head><meta charset="UTF-8"><title>Zed Auth — Brand identity concept v3</title></head>

  <svg width="0" height="0" style="position:absolute">
    <defs>
