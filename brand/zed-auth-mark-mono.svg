    <line x1="52" y1="40" x2="100" y2="34"/>
    <line x1="100" y1="34" x2="150" y2="44"/>
    <line x1="150" y1="44" x2="100" y2="100"/>
    <line x1="100" y1="100" x2="52" y2="156"/>
    <line x1="52" y1="156" x2="100" y2="166"/>
