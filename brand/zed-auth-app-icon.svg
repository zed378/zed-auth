<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-labelledby="zed-auth-app-icon-title">
  <title id="zed-auth-app-icon-title">Zed Auth</title>
  <!--
    App icon: the mark on the ink-navy tile, at the concept's 64% and
    22% corner radius.

    Identical in content to favicon.svg. The concept presents them as
    one asset; they are kept as two files only because consumers
    reference them by different names.

    Extracted from brand/reference/zed-auth-brand-v3.html and
    generated by brand/build.py — edit the generator, not this file.
    brand/check.py fails if the two drift, and re-verifies the
    geometry against the reference.
  -->

  <rect width="200" height="200" rx="44" fill="#0B1220"/>

  <defs>
    <linearGradient id="zedMesh" gradientUnits="userSpaceOnUse"
                    x1="178" y1="18" x2="30" y2="182">
      <stop offset="0%" stop-color="#6BA3FA"/>
      <stop offset="45%" stop-color="#2E4FD1"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <g transform="translate(36 36) scale(0.64)">
    <g stroke="url(#zedMesh)" stroke-width="3.2" stroke-linecap="round" fill="none">
      <line x1="52" y1="40" x2="100" y2="34"/>
      <line x1="100" y1="34" x2="150" y2="44"/>
      <line x1="150" y1="44" x2="100" y2="100"/>
      <line x1="100" y1="100" x2="52" y2="156"/>
      <line x1="52" y1="156" x2="100" y2="166"/>
      <line x1="100" y1="166" x2="150" y2="158"/>
      <line x1="52" y1="40" x2="34" y2="100"/>
      <line x1="34" y1="100" x2="52" y2="156"/>
      <line x1="150" y1="44" x2="166" y2="96"/>
      <line x1="166" y1="96" x2="150" y2="158"/>
      <line x1="52" y1="40" x2="100" y2="100"/>
      <line x1="100" y1="34" x2="100" y2="100"/>
      <line x1="100" y1="100" x2="150" y2="158"/>
      <line x1="100" y1="100" x2="100" y2="166"/>
      <line x1="34" y1="100" x2="100" y2="100"/>
      <line x1="100" y1="100" x2="166" y2="96"/>
      <line x1="34" y1="100" x2="100" y2="34"/>
      <line x1="100" y1="34" x2="166" y2="96"/>
      <line x1="34" y1="100" x2="100" y2="166"/>
      <line x1="100" y1="166" x2="166" y2="96"/>
    </g>

    <g fill="url(#zedMesh)">
      <circle cx="52" cy="40" r="7.5"/>
      <circle cx="100" cy="34" r="7.0"/>
      <circle cx="150" cy="44" r="7.5"/>
      <circle cx="34" cy="100" r="7.5"/>
      <circle cx="166" cy="96" r="7.5"/>
      <circle cx="52" cy="156" r="7.5"/>
      <circle cx="100" cy="166" r="7.0"/>
      <circle cx="150" cy="158" r="7.5"/>
    </g>

    <circle cx="100" cy="100" r="14.0" fill="#16224A"
            stroke="#7B85FA" stroke-width="2.5"/>
  </g>
</svg>
