# Deployed stack for a VM that is exposed through Cloudflare Tunnel.
#
# This is a variant of docker-compose.yml, not a replacement. The difference is
# where TLS terminates:
#
#   docker-compose.yml         Caddy on the host obtains a Let's Encrypt
#                              certificate and terminates TLS on 443.
#   docker-compose.tunnel.yml  Cloudflare terminates TLS at its edge and
#                              `cloudflared` makes an OUTBOUND connection, so
#                              the host needs no inbound port open at all.
#
# Caddy is dropped here rather than kept, for two reasons:
#
#   1. Its ACME challenge would fail. HTTP-01 needs a publicly reachable port
#      80, and behind a tunnel there is none. Running it anyway would produce a
#      service that works but logs certificate errors forever — the kind of
#      permanent-warning state that trains people to ignore logs.
#   2. Cloudflare already terminates TLS. A second termination inside the host
#      would add a hop without adding a guarantee.
#
# What is LOST by dropping Caddy, and how it is handled instead:
#
#   Caddy stripped inbound X-Request-Id so a caller could not choose their own
#   correlation ID. `cloudflared` does NOT strip it. The service therefore runs
#   with AUTH_TRUST_PROXY_HEADERS=false, which makes it generate its own ID and
#   ignore whatever arrives (docs/SECURITY/02 §10). That is why that setting is
#   explicit configuration rather than inferred from the environment.
#
# Ports: everything above 10000, per the host's existing allocations. Only the
# application port is published; PostgreSQL and Redis stay on the internal
# compose network, because nothing outside the service needs them and a
# published database port is a database port someone will eventually reach.

# Container names follow <project>-<service>-1, matching the other stacks on
# this host. Three projects share the `zedauth` prefix rather than one project
# holding everything: `docker compose down` removes every container with the
# project label, not just those in the file it was handed, so a shared name
# would mean stopping the console also stops the database.
name: zedauth

services:
  authservice:
    image: ${AUTH_IMAGE:?AUTH_IMAGE is required}
    restart: always
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      mailpit:  {condition: service_started}

    # Named explicitly rather than loaded with env_file. env_file would pass the
    # whole file in, including AUTH_POSTGRES_OWNER_PASSWORD and
    # AUTH_MIGRATE_DSN — the schema owner's credentials, which bypass row-level
    # security and can alter the audit log. The point of the two-role split is
    # that compromising the service does not yield owner access.
    environment:
      AUTH_ENV: ${AUTH_ENV:?required}
      AUTH_ISSUER: ${AUTH_ISSUER:?required}
      AUTH_HTTP_ADDR: ":8080"
      AUTH_TRUST_PROXY_HEADERS: "false"
      AUTH_POSTGRES_DSN: ${AUTH_POSTGRES_DSN:?required}
      AUTH_POSTGRES_MAX_OPEN_CONNS: ${AUTH_POSTGRES_MAX_OPEN_CONNS:-25}
      AUTH_POSTGRES_MAX_IDLE_CONNS: ${AUTH_POSTGRES_MAX_IDLE_CONNS:-5}
      AUTH_POSTGRES_CONN_MAX_LIFETIME: ${AUTH_POSTGRES_CONN_MAX_LIFETIME:-30m}
      AUTH_REDIS_ADDR: ${AUTH_REDIS_ADDR:-redis:6379}
      AUTH_REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:?required}
      AUTH_REDIS_DB: ${AUTH_REDIS_DB:-0}
      # AUTH_JWT_SIGNING_KEY_REF is deliberately absent. Signing keys live in
      # the signing_keys table since P1-03, and the service now REFUSES to
      # start if the variable is still set — a stale knob that looks like it
      # controls key selection is worse than no knob at all.
      # Breached-password checking (P1-02, ADR-015).
      #
      # On by default. If the corpus service cannot be reached the password is
      # ACCEPTED and the skip is audited, counted and alerted on — failing
      # closed would block password changes during exactly the incident that
      # makes people change passwords. Setting this to "false" is the rollback
      # path; it shows up in auth_password_breach_checks_total as `disabled`
      # rather than as an absence of data.
      AUTH_PASSWORD_BREACH_CHECK_ENABLED: ${AUTH_PASSWORD_BREACH_CHECK_ENABLED:-true}
      AUTH_PASSWORD_BREACH_TIMEOUT: ${AUTH_PASSWORD_BREACH_TIMEOUT:-2s}
      # Outbound mail, into the sink below (ADR-018).
      #
      # Without it an invitation is created and never delivered, so no account
      # on this host can ever have a password — which is the state staging was
      # in until `P1-28`: one organization, one project, zero users, and a
      # console nobody could sign in to.
      #
      # `smtp://` outside local development is normally refused, because an
      # invitation link is a bearer credential and a relay with no STARTTLS
      # hands it to anything on the path. AUTH_SMTP_ALLOW_CLEARTEXT is the
      # operator asserting the hop does not leave the host: `mailpit` resolves
      # on this compose network only, and the service logs the assertion at
      # WARN on every start so it cannot be forgotten.
      AUTH_SMTP_URL: ${AUTH_SMTP_URL:-smtp://mailpit:1025}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-auth@zedth.my.id}
      AUTH_SMTP_ALLOW_CLEARTEXT: ${AUTH_SMTP_ALLOW_CLEARTEXT:-true}
      AUTH_LOG_LEVEL: ${AUTH_LOG_LEVEL:-info}
      AUTH_LOG_FORMAT: ${AUTH_LOG_FORMAT:-json}
      # Metrics listener. Inside the container it binds all interfaces so the
      # compose network can reach it; on the HOST it is published to loopback
      # only (see the ports entry). The endpoint is unauthenticated and
      # discloses request and error rates, so it must never reach the public
      # ingress (docs/PLAN/13, docs/SECURITY/02 §12).
      AUTH_ADMIN_ADDR: "0.0.0.0:9090"
      AUTH_ADMIN_ENABLED: "true"
      # Required, because AUTH_ADMIN_ADDR above is not loopback INSIDE the
      # container — the service refuses to start otherwise. The host publishes
      # the port to 127.0.0.1 only, so the bind is safe, but the service cannot
      # see the host's port mapping and correctly will not assume it.
      AUTH_ADMIN_TOKEN_REF: ${AUTH_ADMIN_TOKEN_REF:?required when the metrics listener binds beyond loopback}
      AUTH_OTLP_ENDPOINT: ${AUTH_OTLP_ENDPOINT:-}
      AUTH_TRACE_SAMPLE_RATIO: ${AUTH_TRACE_SAMPLE_RATIO:-0.05}

    ports:
      # AUTH_BIND_ADDR defaults to loopback, which is the correct posture once
      # the tunnel exists: `cloudflared` runs as a host service and reaches
      # 127.0.0.1 directly, so nothing else on the network can.
      #
      # Set it to 0.0.0.0 only while verifying from another machine before the
      # tunnel is up. Leaving it there afterwards means the service is
      # reachable over plain HTTP from the whole subnet, bypassing the TLS that
      # Cloudflare terminates — every credential and token in clear text on the
      # LAN (docs/PLAN/09 § Transport & Storage: TLS everywhere, no HTTP fallback).
      #
      # Verify with: ss -tlnp | grep <port>  — it must show 127.0.0.1, not 0.0.0.0.
      - "${AUTH_BIND_ADDR:-127.0.0.1}:${AUTH_PUBLIC_PORT:-10800}:8080"

    # The metrics port is deliberately NOT published.
    #
    # It was, briefly, to loopback so a tunnel could route to it. That is a
    # reasonable posture and it is still one step more exposure than this
    # deployment needs: nothing on this host scrapes it yet. A port published
    # for a scraper that does not exist is a port open for no one.
    #
    # The endpoint stays reachable inside the compose network, so a Prometheus
    # container joined to that network scrapes it with no change here. To reach
    # it from the host for a one-off look, add the override that exists for
    # exactly that purpose:
    #
    #   docker compose -f docker-compose.tunnel.yml \
    #                  -f docker-compose.metrics-port.yml up -d
    #
    # Read that file's header before using it.

    volumes:
      - ${AUTH_SECRETS_DIR:?required}:/etc/zed-auth/secrets:ro

    healthcheck:
      test: ["CMD", "/authservice", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    security_opt: [no-new-privileges:true]
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
    deploy:
      resources:
        limits: {memory: 512M}

  # --- Mail sink --------------------------------------------------------------
  #
  # Mailpit accepts everything and delivers nothing, which is exactly right for
  # a staging host: invitations and password resets can be exercised without a
  # single message reaching a real inbox.
  #
  # **Its web interface is NOT tunnelled, and must not be.** It is a mailbox
  # containing password-set links for every account on this host — a bearer
  # credential per message. Loopback only; read it over SSH.
  #
  #   ssh infra@<host> 'curl -sS localhost:10925/api/v1/messages'
  mailpit:
    image: axllent/mailpit:v1.21
    restart: always
    environment:
      # Retention, so the box does not grow without bound. Each message holds a
      # credential, and a short window is both housekeeping and hygiene.
      MP_MAX_MESSAGES: "500"
    ports:
      # Verify with: ss -tlnp | grep 10925 — it must show 127.0.0.1.
      - "127.0.0.1:${AUTH_MAILPIT_PORT:-10925}:8025"
    expose:
      - "1025"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8025/api/v1/info"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  postgres:
    image: postgres:17.2-alpine
    restart: always
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_owner
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_OWNER_PASSWORD:?required}
      # Consumed by init/01-roles.sh. Kept out of the init script itself so the
      # credential never lives in a bind-mounted file.
      AUTH_POSTGRES_APP_PASSWORD: ${AUTH_POSTGRES_APP_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      # WAL archiving is what makes point-in-time recovery possible
      # (docs/PLAN/15 § Backup Strategy). Without it a backup can only restore to
      # the moment it was taken, and RPO becomes the backup interval.
      #
      # The archive lives INSIDE the data volume rather than in a separate
      # named volume. A separate volume is the more obvious design, and it was
      # the first attempt — but Docker creates a named volume's mount point
      # owned by root, and the postgres process runs unprivileged, so every
      # archive_command failed with "Permission denied". That failure is worse
      # than it looks: PostgreSQL retains WAL segments indefinitely while
      # archiving keeps failing, so the disk fills and PITR does not actually
      # work while appearing configured.
      #
      # On a single host (ADR-011, DV-01) the separate volume bought no
      # failure-domain isolation anyway — both live on the same disk. The real
      # off-host protection is backup.sh shipping the dump to AUTH_BACKUP_REMOTE.
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /var/lib/postgresql/data/wal_archive && test ! -f /var/lib/postgresql/data/wal_archive/%f && cp %p /var/lib/postgresql/data/wal_archive/%f
      - -c
      - archive_timeout=300
      - -c
      - max_wal_senders=3
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    # Deliberately NOT published. This host already runs another PostgreSQL on
    # 5432, and more importantly nothing outside the service needs to reach
    # this one. Use `docker compose exec postgres psql` for administration.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_owner -d auth"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.4-alpine
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${AUTH_REDIS_PASSWORD:?required}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    environment:
      AUTH_REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$AUTH_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]

volumes:
  # Named explicitly rather than left to the project prefix.
  #
  # A compose volume is normally `<project>_<name>`, so renaming the project
  # from `zed-auth` to `zedauth` would silently create empty volumes and
  # present an empty database as a successful start. Pinning the names makes
  # the data independent of what the project is called, which is what anyone
  # renaming a stack actually wants.
  postgres_data:
    name: zedauth_postgres_data
  redis_data:
    name: zedauth_redis_data
