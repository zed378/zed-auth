# Static hosting for the console SPA.
#
# `PLAN/06-FRONTEND-ARCHITECTURE.md`: a static build served via CDN or static
# hosting, calling the Management API over HTTPS, deployed independently of the
# backend.
#
# Three things here are not optional, and each has a failure mode that shows up
# only after deployment rather than in a build.

# Cache policy, as a map rather than per-location `add_header`.
#
# This is not a style choice, and getting it wrong is subtle: in nginx,
# `add_header` does NOT accumulate across contexts. A `location` block
# containing any `add_header` of its own discards *every* header set at server
# level. The first version of this file set the security headers on the server
# and the cache headers per location, so the security headers silently vanished
# from exactly the responses people actually load. `curl -I` on the deployed
# site is what found it.
#
# With the policy in a map, every `add_header` lives in one context and nothing
# is dropped.
map $uri $console_cache_control {
    # Fingerprinted assets (index-B1etn7N1.js): the filename changes whenever
    # the content does, so they can be cached immutably.
    ~^/assets/  "public, max-age=31536000, immutable";

    # Everything else, which is index.html under a different name. It must not
    # be cached, and this is the asymmetry people get wrong: index.html is the
    # file that *names* the current bundle. Cached, a returning admin keeps
    # loading the previous release's index.html, which points at the previous
    # release's assets, and the deploy silently never reaches them.
    default     "no-cache, must-revalidate";
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # The history-mode fallback
    #
    # Without this, /projects is looked up as a file, is not found, and the
    # server answers 404 — so the application that would have routed it never
    # loads. It works while you navigate inside the app and breaks the moment
    # anyone refreshes, opens a bookmark, or follows a link from a ticket,
    # which is most of the traffic an admin console gets.
    #
    # Every unmatched path serves index.html and lets the router decide,
    # including genuinely wrong ones — the console's own NotFoundPage answers
    # those, which is the right place for it, because only the application
    # knows which routes exist.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Source maps are built and deliberately not served. They are kept in the
    # build so an error reporter can symbolicate against them later; serving
    # them publishes the console's whole source. 404 rather than 403, so the
    # response does not confirm they exist.
    location ~ \.map$ {
        return 404;
    }

    # ------------------------------------------------------------------
    # Headers, all in one context — see the note on the map above.
    #
    # `always` so they are present on error responses too: a 404 is still a
    # document a browser renders.
    #
    # The backend sets its own security headers (P0-10). None of that reaches a
    # response served by this nginx, so the console needs its own set.
    # ------------------------------------------------------------------
    add_header Cache-Control          $console_cache_control  always;

    # The console is an administration surface. Framing it is the setup for a
    # clickjacked destructive action (SECURITY/02).
    add_header X-Frame-Options        "DENY"                  always;
    add_header X-Content-Type-Options "nosniff"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # No reason for this tool to reach a camera, a microphone or a location.
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # Not indexed. Not a security control — the API enforces every permission
    # independently — but an organization's admin surface has no reason to sit
    # in a search index.
    add_header X-Robots-Tag           "noindex, nofollow"     always;

    # Version disclosure for no benefit.
    server_tokens off;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;
}
