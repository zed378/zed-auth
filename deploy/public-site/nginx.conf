# Static hosting for the public site.
#
# `docs/PLAN/20`: static hosting or a CDN, deployed independently of the console and
# the backend. This is the same nginx arrangement the console preview uses, and
# the differences from it are all deliberate.

# Cache policy as a map, not per-location `add_header`.
#
# In nginx, `add_header` does not accumulate across contexts: a `location` block
# containing any header of its own discards every header set at server level.
# The console's first config hit exactly that and lost its security headers on
# the responses people actually load. One context, varying values in a map.
map $uri $site_cache_control {
    # Docusaurus fingerprints its assets, so those filenames change whenever
    # their content does.
    ~^/assets/          "public, max-age=31536000, immutable";

    # The search index is regenerated on every build and is not fingerprinted.
    # Cached, a visitor searches yesterday's site.
    ~^/search-index     "no-cache, must-revalidate";

    # HTML, the sitemap and the feeds. Short rather than zero: this is public
    # content a CDN should be allowed to serve, but a stale docs page after a
    # correction is the failure that matters here.
    default             "public, max-age=300, must-revalidate";
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Docusaurus emits a real directory-with-index.html per route, so unlike
    # the console this needs no SPA fallback — `$uri/` finds the page. The
    # final fallback is the site's own 404 page, which keeps the header, the
    # footer and the search box, so a wrong link lands somewhere useful rather
    # than on a bare nginx error.
    location / {
        # `=404`, not `/404.html`.
        #
        # A file fallback in try_files serves that file with a **200** status.
        # The visitor sees the right page and every crawler is told the missing
        # URL exists — a soft 404, on the one surface whose entire job is being
        # discovered (`docs/PLAN/20`: SEO is critical here). `=404` returns the real
        # status and `error_page` below renders the styled page, so the reader
        # keeps the header, footer and search box either way.
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Serving the error page must not itself be a 404 loop.
    location = /404.html {
        internal;
    }

    # ------------------------------------------------------------------
    # Headers, all in one context.
    # ------------------------------------------------------------------
    add_header Cache-Control          $site_cache_control     always;

    # Unlike the console, this site MAY be framed nowhere by default but is
    # meant to be indexed — SEO is named as critical in `docs/PLAN/20`, since this
    # is how the product gets discovered. So no X-Robots-Tag here.
    add_header X-Frame-Options        "DENY"                  always;
    add_header X-Content-Type-Options "nosniff"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
