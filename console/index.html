<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The console is an internal administration tool. Keeping it out of search
      results is not a security control — the API enforces every permission
      independently (PLAN/08) — but there is no reason for an organization's
      admin surface to be indexed.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      An inline favicon rather than a file. The browser requests /favicon.ico
      unconditionally, and a static host answers 404 — a console error on every
      page load that means nothing and trains people to ignore the console.
      A data URI answers the request without a round trip.

      The mark is a keyhole, and the colour is --color-accent's value. It is
      the one place a token value is duplicated: an <svg> in a data URI cannot
      read a CSS custom property, because it is parsed before the stylesheet
      exists.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M16 8a4.5 4.5 0 0 0-2.2 8.4L12.5 24h7l-1.3-7.6A4.5 4.5 0 0 0 16 8z' fill='%23fff'/%3E%3C/svg%3E"
    />

    <title>Zed Auth Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
