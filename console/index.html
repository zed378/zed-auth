<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The console is an internal administration tool. Keeping it out of search
      results is not a security control — the API enforces every permission
      independently (docs/PLAN/08) — but there is no reason for an organization's
      admin surface to be indexed.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      A real file rather than a data URI.

      The URI existed to answer the browser's unconditional /favicon.ico
      request without a 404, and an explicit rel="icon" does that just as well
      — a browser that is told where the icon is does not go looking for
      favicon.ico. It also stops the mark being duplicated as escaped markup
      in an HTML file, where brand/check.py could not see it drift.

      The asset is a copy of brand/favicon.svg. The copy is deliberate: the
      console and the public site share the visual language and no code
      (docs/PLAN/20), so each keeps its own. brand/check.py fails if a copy stops
      matching its source.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Zed Auth Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
